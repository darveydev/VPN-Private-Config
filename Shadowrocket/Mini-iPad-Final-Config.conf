DST-PORT,5349,REJECT

# 明文 DNS
# hijack-dns 只覆盖 TUN 直连的 UDP/53，
# 应用自己走 UDP Relay 的明文 DNS 会落到这条上被直接拒绝。
# 若某个 App 因此解析失败，在该 App 的域名前加一条 DOMAIN-SUFFIX,xxx,DIRECT 即可
DST-PORT,53,REJECT


# ============================================================
# 6. DNS LEAK TEST
# ============================================================

DOMAIN-SUFFIX,dnsleaktest.com,🌐 GLOBAL
DOMAIN-SUFFIX,ipleak.net,🌐 GLOBAL
DOMAIN-SUFFIX,browserleaks.com,🌐 GLOBAL


# ============================================================
# 7. ADBLOCK
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/reject.txt,🛑 ADBLOCK,update-interval=86400


# ============================================================
# 8. CHINA DIRECT
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/direct.txt,DIRECT,update-interval=86400
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/cncidr.txt,DIRECT,update-interval=86400
GEOIP,CN,DIRECT,no-resolve


# ============================================================
# 9. FINAL
# ============================================================

FINAL,🐟 FINAL

[Host]
localhost = 127.0.0.1

[URL Rewrite]


# ============================================================
# Google CN
# ============================================================

'^http://(www\.)?g\.cn($|/.*)' 'https://www.google.com$2' 302
'^http://(www\.)?google\.cn($|/.*)' 'https://www.google.com$2' 302


# ============================================================
# Google HK / TW
# ============================================================

'^http://(www\.)?google\.com\.hk($|/.*)' 'https://www.google.com$2' 302
'^http://(www\.)?google\.com\.tw($|/.*)' 'https://www.google.com$2' 302


# ============================================================
# Google regional domains
# ============================================================

'^http://(www\.)?google\.com\.[a-z]{2}($|/.*)' 'https://www.google.com$2' 302
'^http://(www\.)?google\.co\.[a-z]{2}($|/.*)' 'https://www.google.com$2' 302
'^http://(www\.)?google\.[a-z]{2}($|/.*)' 'https://www.google.com$2' 302


# ============================================================
# Google HTTP -> HTTPS
# ============================================================

'^http://(www\.)?google\.com($|/.*)' 'https://www.google.com$2' 302

