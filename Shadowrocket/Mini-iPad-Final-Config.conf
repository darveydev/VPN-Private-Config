[Rule]


# ============================================================
# 1. LOCAL
# 内网流量直连，同时把回环段排除在 TUN 之外
# ============================================================

IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve


# ============================================================
# 2. CAPTIVE PORTAL / APPLE SYSTEM
# 必须放在 ADBLOCK 之前：reject.txt 里有苹果服务的误杀记录
# ============================================================

# Wi-Fi 联网检测，弹不出登录页时先查这几条
DOMAIN-SUFFIX,captive.apple.com,DIRECT
DOMAIN,connectivitycheck.gstatic.com,DIRECT

# 软件更新检查（日志实测被 reject.txt 拒过）
DOMAIN-SUFFIX,mesu.apple.com,DIRECT

# iCloud 诊断上报（拒了会拖慢「查找」「iCloud 设置」加载）
DOMAIN-SUFFIX,metrics.icloud.com,DIRECT


# ============================================================
# 3. TAILSCALE
# 100.64/10 是运营商级 NAT 段，不排除会抢走 Tailscale 路由
# ============================================================

IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
DOMAIN-SUFFIX,ts.net,DIRECT
DOMAIN-SUFFIX,tailscale.com,🌐 GLOBAL


# ============================================================
# 4. DNS SECURITY
# ============================================================

# DoT
DST-PORT,853,REJECT

# STUN
DST-PORT,5349,REJECT

# 明文 DNS
DST-PORT,53,REJECT


# ============================================================
