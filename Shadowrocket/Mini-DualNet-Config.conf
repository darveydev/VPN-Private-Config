🌏 SOUTH EAST ASIA = url-test,policy-select-name=新加坡专线 E3,interval=300,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(🇲🇾)|(马来西亚)|(馬來西亞)|(Malaysia)|(Kuala Lumpur)|(吉隆坡)|(🇹🇭)|(泰国)|(泰國)|(Thailand)|(Bangkok)|(曼谷)|(🇻🇳)|(越南)|(Vietnam)|(Hanoi)|(Ho Chi Minh)|(河内)|(胡志明)|(🇮🇩)|(印尼)|(印度尼西亚)|(Indonesia)|(Jakarta)|(雅加达)|(🇵🇭)|(菲律宾)|(菲律賓)|(Philippines)|(Manila)|(马尼拉)|(🇰🇭)|(柬埔寨)|(Cambodia)|(Phnom Penh)


# =========================================================
# South Asia
# =========================================================

🇮🇳 SOUTH ASIA = url-test,policy-select-name=印度专线 E1,interval=300,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇮🇳)|(印度)|(India)|(Mumbai)|(孟买)|(Delhi)|(新德里)|(Bangalore)|(班加罗尔)


# =========================================================
# Eurasia
# =========================================================

🇹🇷 EURASIA = url-test,policy-select-name=土耳其家宽 E2,interval=300,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇹🇷)|(土耳其)|(Turkey)|(Turkiye)|(Istanbul)|(伊斯坦布尔)


# =========================================================
# Europe
# 跨地区组，去掉裸二字母代码 (DE)/(FR)/(SE)/(NL) 等，只留完整名称
# =========================================================

🇪🇺 EUROPE = url-test,policy-select-name=德国专线 E1,interval=300,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇬🇧)|(🇩🇪)|(🇫🇷)|(🇸🇪)|(🇳🇱)|(🇱🇹)|(🇧🇬)|(英国)|(德國)|(德国)|(法国)|(法國)|(瑞典)|(荷兰)|(荷蘭)|(立陶宛)|(保加利亚)|(United Kingdom)|(London)|(伦敦)|(Germany)|(Frankfurt)|(法兰克福)|(France)|(Paris)|(巴黎)|(Sweden)|(Stockholm)|(斯德哥尔摩)|(Netherlands)|(Amsterdam)|(阿姆斯特丹)|(Lithuania)|(Vilnius)|(Bulgaria)|(Sofia)


# =========================================================
# HK / Macau —— 与 HK 一样承载主力流量，interval 收到 120
# =========================================================

🇭🇰🇲🇴 HK/MO = url-test,policy-select-name=香港专线 E2,interval=120,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇭🇰)|(🇲🇴)|(香港)|(澳门)|(澳門)|(Hong Kong)|(Macau)|(Macao)


# =========================================================
# AdBlock
# =========================================================

🛑 ADBLOCK = select,REJECT,DIRECT

[Rule]


# ============================================================
# 1. LOCAL
# 内网流量直连
# ============================================================

IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve


# ============================================================
# 2. CAPTIVE PORTAL / APPLE SYSTEM
# 必须放在 ADBLOCK 之前：reject.txt 里有苹果服务的误杀记录
# ============================================================

# Wi-Fi 联网检测，弹不出登录页时先查这几条
DOMAIN-SUFFIX,captive.apple.com,DIRECT
DOMAIN,connectivitycheck.gstatic.com,DIRECT

# 软件更新检查（reject.txt 把 mesu.apple.com 判了 REJECT）
DOMAIN-SUFFIX,mesu.apple.com,DIRECT

# iCloud 诊断上报（拒了会拖慢「查找」「iCloud 设置」加载）
DOMAIN-SUFFIX,metrics.icloud.com,DIRECT


# ============================================================
# 3. TAILSCALE
# 100.64/10 是运营商级 NAT 段，不排除会抢走 Tailscale 路由
# ============================================================

IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
DOMAIN-SUFFIX,ts.net,DIRECT
DOMAIN-SUFFIX,tailscale.com,🌐 GLOBAL


# ============================================================
# 4. WECHAT / WECHATPAY DNS
# reject.txt 里含这两个域，被拒后微信会不断重连，必须前置放行
# ============================================================

DOMAIN,dns.weixin.qq.com.cn,DIRECT
DOMAIN,paydns.wechatpay.cn,DIRECT


# ============================================================
# 5. DNS SECURITY
# ============================================================

# DoT
DST-PORT,853,REJECT

# STUN
DST-PORT,5349,REJECT

# 【关键修复】删除 DST-PORT,53,REJECT
# 原配置这条 + hijack-dns = :53 双重封锁，
# Wi-Fi 路由器自己做 DNS 转发时全部被 REJECT → 域名解析失败 → 测速全 timeout
# hijack-dns = :53 已经接管所有 UDP/53，不需要再 REJECT
# 若担心 DNS 泄露，hijack-dns 足够覆盖；个别 App 走 TCP/53 的极少


# ============================================================
# 6. DNS LEAK TEST
# ============================================================

DOMAIN-SUFFIX,dnsleaktest.com,🌐 GLOBAL
DOMAIN-SUFFIX,ipleak.net,🌐 GLOBAL
DOMAIN-SUFFIX,browserleaks.com,🌐 GLOBAL


# ============================================================
# 7. ADBLOCK
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/reject.txt,🛑 ADBLOCK,update-interval=86400


# ============================================================
# 8. CHINA DIRECT
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/direct.txt,DIRECT,update-interval=86400
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/cncidr.txt,DIRECT,update-interval=86400
GEOIP,CN,DIRECT,no-resolve


# ============================================================
# 9. FINAL
# ============================================================

FINAL,🐟 FINAL

[Host]
localhost = 127.0.0.1

[URL Rewrite]


# ============================================================
# Google CN
# ============================================================

'^http://(www\.)?g\.cn($|/.*)' 'https://www.google.com$2' 302
'^http://(www\.)?google\.cn($|/.*)' 'https://www.google.com$2' 302


# ============================================================
# Google HK / TW
# ============================================================

'^http://(www\.)?google\.com\.hk($|/.*)' 'https://www.google.com$2' 302
'^http://(www\.)?google\.com\.tw($|/.*)' 'https://www.google.com$2' 302


# ============================================================
