🇸🇬 SG = url-test,policy-select-name=新加坡专线 E2,interval=300,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)


# =========================================================
# North America
# =========================================================

🌎 NORTH AMERICA = url-test,policy-select-name=美国家宽 E2,interval=300,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(🇺🇸)|(🇨🇦)|(美国)|(美國)|(加拿大)|(United States)|(USA)|(Canada)|(Los Angeles)|(San Francisco)|(New York)|(Seattle)|(Chicago)|(Miami)|(Toronto)|(Vancouver)|(Montreal)


