[Host]

localhost = 127.0.0.1

[URL Rewrite]

# Google CN -> Google Global
'^https?://(www\.)?g\.cn($|/.*)' 'https://www.google.com$2' 302
'^https?://(www\.)?google\.cn($|/.*)' 'https://www.google.com$2' 302

# Google HK / TW -> Google Global
'^https?://(www\.)?google\.com\.hk($|/.*)' 'https://www.google.com$2' 302
'^https?://(www\.)?google\.com\.tw($|/.*)' 'https://www.google.com$2' 302

# Google regional domains
'^https?://(www\.)?google\.com\.[a-z]{2}($|/.*)' 'https://www.google.com$2' 302
'^https?://(www\.)?google\.co\.[a-z]{2}($|/.*)' 'https://www.google.com$2' 302
'^https?://(www\.)?google\.[a-z]{2}($|/.*)' 'https://www.google.com$2' 302

# Google HTTP -> HTTPS
'^http://(www\.)?google\.com($|/.*)' 'https://www.google.com$2' 302

