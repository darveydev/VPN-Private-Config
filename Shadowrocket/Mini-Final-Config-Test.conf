# ============================================================
# 【备用写法：把 url-test 换成 fallback】
#
# 如果 interval=120 之后，坏节点还是切得慢，就把 🇭🇰 HK 整行替换成下面这行。
#
# fallback 与 url-test 的区别：
#   · url-test：按延迟择优，只在 interval 到期时整组重测；
#               节点失败只记一次 fails，不会立刻换 → 最坏情况锁死 interval 秒
#   · fallback：按列表顺序取第一个可用节点，当前节点失败**立即**跳下一个，
#               不用等 interval；代价是不按延迟择优，永远偏向靠前的节点
#
# 用法：把节点按「稳定性从高到低」排好序，越稳的越靠前。
# 本次日志里 E2 / E4 表现最差（E4 被对端关闭 110 次），E1 / E3 / 家宽 E5、E6 更稳。
#
# 🇭🇰 HK = fallback,香港专线 E1,香港专线 E3,香港家宽 E5,香港家宽 E6,香港专线 E2,香港专线 E4,香港直连 01 0.5X
#
# ============================================================
