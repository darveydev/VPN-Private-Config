♻️ AUTO = url-test,policy-select-name=香港专线 E2,interval=120,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=(香港)|(台湾)|(台灣)|(日本)|(韩国)|(韓國)|(新加坡)|(美国)|(美國)|(加拿大)|(英国)|(德国)|(德國)|(法国)|(法國)|(荷兰)|(荷蘭)|(瑞典)|(立陶宛)|(保加利亚)|(土耳其)|(印度)|(越南)|(泰国)|(泰國)|(马来西亚)|(馬來西亞)|(印尼)|(菲律宾)|(菲律賓)|(柬埔寨)|(澳门)|(澳門)

