# ============================================================
# 7. ADBLOCK
#
# 注意：xz.fbcdn.net / xy.fbcdn.net（Instagram 的 netseer 上报域）
# 仍在本规则集里被拦截，这是**刻意保留**的：
# 改成 DIRECT 反而更糟——这两个域在国内不可达，DIRECT 会挂到超时，
# 而 REJECT 是立刻 RST，App 能马上放弃。日志里 Instagram 挂掉的
# 真实原因是节点，不是这两个域。
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/reject.txt,🛑 ADBLOCK,update-interval=86400


