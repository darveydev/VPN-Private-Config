DOMAIN-SUFFIX,tailscale.com,🌐 GLOBAL

# ============================================================
# 3. APPLE 关键服务 —— 【本次新增，P1 修复】
#
# reject.txt 会误杀 metrics.icloud.com / mesu.apple.com，
# 日志实测分别被 REJECT 24 次 / 2 次，导致 iCloud 指标异常、
# 系统软件更新失败。必须前置放行，优先级高于 ADBLOCK。
# ============================================================

DOMAIN,mesu.apple.com,DIRECT
DOMAIN-SUFFIX,metrics.icloud.com,DIRECT
DOMAIN-SUFFIX,icloud.com,DIRECT
DOMAIN-SUFFIX,icloud.com.cn,DIRECT
DOMAIN-SUFFIX,apple.com,DIRECT
DOMAIN-SUFFIX,apple.com.cn,DIRECT
DOMAIN-SUFFIX,apple-cloudkit.com,DIRECT
DOMAIN-SUFFIX,apple-mapkit.com,DIRECT

# ============================================================
# 4. WECHAT / WECHATPAY DNS
# ============================================================

DOMAIN,dns.weixin.qq.com.cn,DIRECT
DOMAIN,paydns.wechatpay.cn,DIRECT

# ============================================================
# 5. QQ 邮箱 —— 【本次新增，P1 辅助修复】
#
# 日志里 1507932547@qq.com:993 被当域名解析（客户端 IMAP 配置错误）。
# 真正问题在邮件客户端：IMAP 服务器应填 imap.qq.com（993），
# SMTP 应填 smtp.qq.com（465/587），而不是邮箱账号本身。
# 这里把 qq.com 归入 DIRECT，避免被 #proxy DNS 拖慢或误伤。
# ============================================================

DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,imap.qq.com,DIRECT
DOMAIN-SUFFIX,smtp.qq.com,DIRECT

# ============================================================
# 6. DNS SECURITY
# ============================================================

# DoT
DST-PORT,853,REJECT

# STUN
DST-PORT,5349,REJECT

# 明文 DNS
# hijack-dns 只覆盖 TUN 直连的 UDP/53，应用自己走 UDP Relay 的明文 DNS 落到这条被拒
DST-PORT,53,REJECT

# ============================================================
# 7. DNS LEAK TEST
# ============================================================

DOMAIN-SUFFIX,dnsleaktest.com,🌐 GLOBAL
DOMAIN-SUFFIX,ipleak.net,🌐 GLOBAL
DOMAIN-SUFFIX,browserleaks.com,🌐 GLOBAL

# ============================================================
# 8. ADBLOCK
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/reject.txt,🛑 ADBLOCK,update-interval=86400

# ============================================================
# 9. CHINA DIRECT
# ============================================================

RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/direct.txt,DIRECT,update-interval=86400
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/cncidr.txt,DIRECT,update-interval=86400
GEOIP,CN,DIRECT,no-resolve

