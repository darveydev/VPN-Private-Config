# South Asia
🇮🇳 South Asia = url-test,interval=300,tolerance=50,timeout=10,url=http://www.gstatic.com/generate_204,policy-select-name=印度专线 01,policy-regex-filter=(🇮🇳)|(印度)|(India)|(IN)|(Mumbai)|(孟买)|(Delhi)|(New Delhi)|(新德里)|(Bangalore)|(班加罗尔)

# Eurasia
🇹🇷 Eurasia = url-test,policy-select-name=土耳其家宽 E2,interval=300,tolerance=50,timeout=10,url=http://www.gstatic.com/generate_204,policy-regex-filter=(🇹🇷)|(土耳其)|(Turkey)|(Turkiye)|(TR)|(Istanbul)|(伊斯坦布尔)

# Europe
🇪🇺 Europe = url-test,policy-select-name=德国专线 E1,interval=300,tolerance=50,timeout=10,url=http://www.gstatic.com/generate_204,policy-regex-filter=(🇬🇧)|(🇩🇪)|(🇫🇷)|(🇸🇪)|(🇳🇱)|(🇱🇹)|(🇧🇬)|(英国)|(英)|(United Kingdom)|(UK)|(London)|(伦敦)|(Germany)|(德国)|(德)|(DE)|(Frankfurt)|(法兰克福)|(France)|(法国)|(法)|(FR)|(Paris)|(巴黎)|(Sweden)|(瑞典)|(SE)|(Stockholm)|(斯德哥尔摩)|(Netherlands)|(荷兰)|(NL)|(Amsterdam)|(阿姆斯特丹)|(Lithuania)|(立陶宛)|(LT)|(Vilnius)|(Bulgaria)|(保加利亚)|(BG)|(Sofia)|(索非亚)

# Hong Kong / Macau
🇭🇰🇲🇴 HK/MO = url-test,interval=300,tolerance=30,timeout=10,url=http://www.gstatic.com/generate_204,policy-regex-filter=(🇭🇰)|(🇲🇴)|(香港)|(港)|(Hong Kong)|(Hong)|(HK)|(澳门)|(澳)|(Macau)|(Macao)|(MO)

# AdBlock
🛑 AdBlock = select,REJECT,DIRECT

# DIRECT = select,direct

# REJECT = select,reject

[Rule]
# Local networks
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# Tailscale
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
DOMAIN-SUFFIX,ts.net,DIRECT
DOMAIN-SUFFIX,tailscale.com,🌐 Global

# Apple Push：允许 APNs 直连，降低代理对 Apple Watch / iPhone 推送的影响
DOMAIN-SUFFIX,push.apple.com,DIRECT
DST-PORT,5223,DIRECT

# DNS security
DST-PORT,853,REJECT
DST-PORT,5349,REJECT
DST-PORT,53,REJECT

# DNS leak test sites：通过代理测试出口 DNS
DOMAIN-SUFFIX,dnsleaktest.com,🌐 Global
DOMAIN-SUFFIX,ipleak.net,🌐 Global
DOMAIN-SUFFIX,browserleaks.com,🌐 Global

# AdBlock
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/reject.txt,🛑 AdBlock,update-interval=86400

# China direct
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/direct.txt,DIRECT,update-interval=86400
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/ruleset/cncidr.txt,DIRECT,update-interval=86400
GEOIP,CN,DIRECT,no-resolve

# Final
FINAL,🐟 Final

[Host]
localhost = 127.0.0.1

