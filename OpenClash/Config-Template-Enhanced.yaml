# 必读！！！
# 此配置不防DNS泄露，想使用防泄漏专业版本请使用同目录下另一个名字为mihomo的版本
# 机场订阅
proxy-providers:
  Now加速-Gmail:
    url: "https://nowjump.tiaotiao.org/https://hi.nowjiasu.com/now/746bdbd82bc54c8f59d47d0afe6a764c"
    type: http
    interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块：国内域名走国内加密DNS；其余域名默认经专用代理组访问海外DoH
dns:
  enable: true
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "localhost"
    - "+.market.xiaomi.com"

  # 仅用于启动/解析 DNS 上游域名的引导解析；不是普通网站域名的默认解析出口
  default-nameserver:
    - 1.1.1.1
    - 1.0.0.1

  # 未命中国内域名策略的请求默认经专用代理组访问海外 DoH，避免回退到明文/运营商 DNS
  nameserver:
    - "https://dns.google/dns-query#🔒 DNS专用"
    - "https://cloudflare-dns.com/dns-query#🔒 DNS专用"

  # 使用本配置已存在的规则集分类
  nameserver-policy:
    "rule-set:cn_domain":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "rule-set:private_domain":
      - "https://dns.alidns.com/dns-query"
    "rule-set:cn!_domain":
      - "https://dns.google/dns-query#🔒 DNS专用"
      - "https://cloudflare-dns.com/dns-query#🔒 DNS专用"
    
  # 只负责解析代理节点域名，避免代理节点尚未建立时出现 DNS 循环依赖
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

