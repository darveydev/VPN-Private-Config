    filter: '(?i)(英国|United Kingdom|London|伦敦|德国|Germany|Frankfurt|法兰克福|法国|France|Paris|巴黎|瑞典|Sweden|Stockholm|斯德哥尔摩|荷兰|Netherlands|Amsterdam|阿姆斯特丹|立陶宛|Lithuania|Vilnius|保加利亚|Bulgaria|Sofia|索非亚|🇬🇧|🇩🇪|🇫🇷|🇸🇪|🇳🇱|🇱🇹|🇧🇬)'

  - name: "♻️ 欧洲自动"
    type: url-test
    include-all: true
    tolerance: 20
    interval: 300
    filter: '(?i)(英国|United Kingdom|London|伦敦|德国|Germany|Frankfurt|法兰克福|法国|France|Paris|巴黎|瑞典|Sweden|Stockholm|斯德哥尔摩|荷兰|Netherlands|Amsterdam|阿姆斯特丹|立陶宛|Lithuania|Vilnius|保加利亚|Bulgaria|Sofia|索非亚|🇬🇧|🇩🇪|🇫🇷|🇸🇪|🇳🇱|🇱🇹|🇧🇬)'

  # =========================================================
  # 18. 澳门
  # =========================================================

  - name: "🇲🇴 澳门节点"
    type: select
    include-all: true
    filter: '(?i)(澳门|Macau|Macao|🇲🇴|MO)'

  - name: "🔯 澳门故转"
    type: fallback
    include-all: true
    interval: 300
    filter: '(?i)(澳门|Macau|Macao|🇲🇴|MO)'

  - name: "♻️ 澳门自动"
    type: url-test
    include-all: true
    tolerance: 20
    interval: 300
    filter: '(?i)(澳门|Macau|Macao|🇲🇴|MO)'

  # =========================================================
  # 19. 港澳合并
  # =========================================================

  - name: "🇭🇰 港澳节点"
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇲🇴 澳门节点

  - name: "🔯 港澳故转"
    type: fallback
    include-all: true
    interval: 300
    filter: '(?i)(香港|港|Hong Kong|HongKong|🇭🇰|HK|澳门|Macau|Macao|🇲🇴|MO)'

  - name: "♻️ 港澳自动"
    type: url-test
    include-all: true
    tolerance: 20
    interval: 300
    filter: '(?i)(香港|港|Hong Kong|HongKong|🇭🇰|HK|澳门|Macau|Macao|🇲🇴|MO)'

  # =========================================================
  # 20. 全局自动测速和全部节点
  # =========================================================

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    tolerance: 20
    interval: 300
    filter: '^(?!.*(直连)).*$'

  - name: "🌐 全部节点"
    type: select
    include-all: true


