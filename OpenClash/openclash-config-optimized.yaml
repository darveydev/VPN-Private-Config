# ==================== 8. Routing Rules ====================

rules:
  # 非国内 UDP 443 禁止 QUIC，优先使用 TCP
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT

  # 私有网络
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连

  # AI
  - RULE-SET,ai_domain,🤖 AI

  # Google / YouTube / GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,github_domain,👨🏿‍💻 GitHub

  # Microsoft
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoftcn_domain,直连
  - RULE-SET,microsoft_domain,🪟 Microsoft

  # Apple
  - RULE-SET,applecn_domain,直连
  - RULE-SET,apple_domain,🍎 Apple

  # Social
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,tiktok_domain,🎵 TikTok

  # Streaming
  - RULE-SET,netflix_domain,🎥 NETFLIX

  # Wallet
  - RULE-SET,paypal_domain,💶 Wallet
  - RULE-SET,binance_domain,💶 Wallet
  - RULE-SET,okx_domain,💶 Wallet
  - RULE-SET,usd_domain,💶 Wallet

  # Steam
  - RULE-SET,steamcn_domain,直连
  - RULE-SET,steam_domain,🎮 Steam

  # Domestic
  - RULE-SET,cn!_domain,🚀 默认代理

  # IP rules
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,apple_ip,🍎 Apple
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,netflix_ip,🎥 NETFLIX

  - RULE-SET,cn_ip,直连,no-resolve

  # Final
  - MATCH,🐟 漏网之鱼

# ==================== 9. Rule Providers ====================

rule-providers:

  # Fake-IP Filters
  fakeipfilter_cn:
    type: http
    behavior: domain
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-cn.list"

  fakeipfilter_!cn:
    type: http
    behavior: domain
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-!cn.list"

  # Domain Rule Sets
  private_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs"

  ai_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ai-!cn.mrs"

  youtube_domain:
    type: http
    behavior: domain
