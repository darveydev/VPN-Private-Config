# ============================================================
# OpenClash Stable - GL-MT6000 Optimized Edition
# DNS Leak Protection + Dual Providers + Smart Failover
# Based on qichiyuhub Mihomo DNS architecture
# ============================================================

# ==================== 1. Proxy Providers ====================

proxy-providers:
  Now加速-Gmail:
    type: http
    url: "https://nowjump.tiaotiao.org/https://hi.nowjiasu.com/now/"
    interval: 0
    proxy: 直连
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true

  赔钱机场:
    type: http
    url: "https://dasho.xn--cp3a08l.com/api/v1/pq/"
    interval: 0
    proxy: 直连
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true

# ==================== 2. Hosts ====================

hosts:
  "dns.alidns.com":
    - 223.5.5.5
    - 223.6.6.6
  "doh.pub":
    - 1.12.12.12
    - 120.53.53.53
  "cloudflare-dns.com":
    - 1.1.1.1
    - 1.0.0.1
  "dns.google":
    - 8.8.8.8
    - 8.8.4.4

# ==================== 3. General ====================

proxies:
  - name: 直连
    type: direct
    udp: true

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false

mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true

keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# 管理面板：仅允许可信 LAN 访问
external-controller: 0.0.0.0:9090
secret: "请替换为你自己生成的随机高强度密钥"
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ==================== 4. Sniffer ====================

sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443
        - 8443

  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== 5. TUN ====================

tun:
  enable: true
  stack: mips

  dns-hijack:
    - "any:53"
    - "tcp://any:53"

  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==================== 6. DNS Leak Protection ====================

dns:
  enable: true

  # DNS 缓存
  cache-algorithm: arc

  # 不解析 IPv6 DNS 记录
  ipv6: false

  # 使用 Fake-IP
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-ttl: 1
  fake-ip-filter-mode: blacklist

  # 禁止使用系统 DNS 作为隐式备用路径
  use-system-hosts: false

  # DNS 引导服务器
  # 必须使用 IP，避免 DoH 域名解析循环
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6

  # 国内 DNS：负责解析代理节点服务器域名
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 国内直连 DNS
  direct-nameserver:
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true

  # 直连域名解析遵循 nameserver-policy
  direct-nameserver-follow-policy: true

  # 默认国外 DNS
  # 强制通过默认代理策略组访问
  nameserver:
    - "https://dns.google/dns-query#🚀 默认代理&disable-qtype-65=true"

  # 国外备用 DNS
  fallback:
    - "https://cloudflare-dns.com/dns-query#🚀 默认代理&disable-qtype-65=true"

  # 备用 DNS 污染判断
  fallback-filter:
    geoip: true
    geoip-code: CN

    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32

  # 国内、私有、特殊服务域名使用国内 DNS
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain":
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true

    # 特定非中国域名使用海外 DNS
    "rule-set:fakeipfilter_!cn":
      - "https://dns.google/dns-query#🚀 默认代理&disable-qtype-65=true"

  # Fake-IP 过滤规则
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.home"
    - "*.internal"
    - "localhost"
    - "+.localhost"
    - "time.*.com"
    - "time.*.gov"
    - "+.ntp.org"
    - "Mijia Cloud"
    - "+.push.apple.com"

    # 国内域名
    - "rule-set:fakeipfilter_cn"
    - "rule-set:cn_domain"

    # 非国内特殊域名
    - "rule-set:fakeipfilter_!cn"

    # 私有及国内服务
    - "rule-set:private_domain"
    - "rule-set:applecn_domain"
    - "rule-set:microsoftcn_domain"
    - "rule-set:steamcn_domain"

